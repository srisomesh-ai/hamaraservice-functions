name: Deploy Firebase Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Install dependencies
        run: cd functions && npm install
        
      - name: Syntax check
        run: node --check functions/index.js

      # Sets the Firebase secret from the GitHub secret HS_PUSH_KEY, so no
      # local Firebase CLI is needed. Same value as PUSH_KEY in hs-secrets.php.
      - name: Set push key secret
        env:
          HS_PUSH_KEY: ${{ secrets.HS_PUSH_KEY }}
        run: |
          if [ -z "$HS_PUSH_KEY" ]; then
            echo "::error::Add the GitHub secret HS_PUSH_KEY (Settings > Secrets and variables > Actions)"; exit 1
          fi
          printf '%s' "$HS_PUSH_KEY" > /tmp/hs_push_key
          firebase functions:secrets:set HS_PUSH_KEY --data-file /tmp/hs_push_key --project hamaraservice-s009 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          rm -f /tmp/hs_push_key

      # --force also deletes functions that were removed from source
      # (createOrder, verifyPayment, onBookingChange). Requires the secret
      # HS_PUSH_KEY: firebase functions:secrets:set HS_PUSH_KEY
      - name: Deploy Functions + locked-down DB/Storage rules
        run: firebase deploy --only functions,database,storage --project hamaraservice-s009 --token "${{ secrets.FIREBASE_TOKEN }}" --force
